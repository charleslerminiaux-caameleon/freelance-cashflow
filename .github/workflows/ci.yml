name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-local-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-local-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Supabase CLI version contract
        run: pnpm check:supabase-cli
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:run
      - name: Build
        run: pnpm build

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start dedicated Supabase stack
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset --local
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop dedicated Supabase stack
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Chromium manual cashflow journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Start dedicated Supabase stack
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset --local
      - name: Install Chromium
        run: pnpm --filter @fc/web exec playwright install --with-deps chromium
      - name: Run complete manual journey
        shell: bash
        run: |
          set +x
          eval "$(supabase status --output env)"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          pnpm --filter @fc/web e2e
      - name: Stop dedicated Supabase stack
        if: always()
        run: supabase stop --no-backup
